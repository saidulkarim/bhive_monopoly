name: monopoly
description: "bHiVE Monopoly Game"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  intl: any
  image: 4.5.4
  web_socket_channel: ^3.0.3
  audioplayers: 6.1.0
  model_viewer_plus: 1.10.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  pdfx: ^2.11.0
  battery_plus: ^7.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/audio/
    - assets/models/
    - assets/guides/
    - assets/icons/app_icon.png
    - assets/fonts/Noto/NotoSansBengali-OFL.txt

  fonts:
    - family: Exo2
      fonts:
        - asset: assets/fonts/Exo2-Thin.ttf
          weight: 100
        - asset: assets/fonts/Exo2-Light.ttf
          weight: 300
        - asset: assets/fonts/Exo2-Regular.ttf
          weight: 400
        - asset: assets/fonts/Exo2-Italic.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/Exo2-Bold.ttf
          weight: 700

    # Default Bangla Unicode font
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/Noto/NotoSansBengali-Regular.ttf
          weight: 400
        - asset: assets/fonts/Noto/NotoSansBengali-Medium.ttf
          weight: 500
        - asset: assets/fonts/Noto/NotoSansBengali-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Noto/NotoSansBengali-Bold.ttf
          weight: 700
        - asset: assets/fonts/Noto/NotoSansBengali-ExtraBold.ttf
          weight: 800

    # Preferred Bangla font (configured in FontCatalog).
    - family: KarnaphuliMJ
      fonts:
        - asset: assets/fonts/KarnaphuliMJ.ttf
          weight: 400

    # Fallback Bangla Unicode font.
    - family: Nikosh
      fonts:
        - asset: assets/fonts/Nikosh.ttf
          weight: 400

    # Optional Bangla font: use only if its glyphs support Unicode Bengali.
    - family: Hadi
      fonts:
        - asset: assets/fonts/Hadi.ttf
          weight: 400

    # Separate family; do not register two regular faces under Nikosh.
    - family: NikoshBAN
      fonts:
        - asset: assets/fonts/NikoshBAN.ttf
          weight: 400

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/app_icon.png

  web:
    generate: true
    image_path: assets/icons/app_icon.png
    background_color: "#0B1011"
    theme_color: "#0B1011"
